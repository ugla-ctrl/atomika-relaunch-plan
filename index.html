<style>
  /* Layout: single column mission document. Sectioned rules, instrument-panel labels,
     two hand-drawn SVG figures (timeline rail, capital waterfall) in scroll containers. */
  :root {
    --ground: #f1f0ec;
    --panel: #fafaf9;
    --panel-2: #e9e8e2;
    --ink: #15160f;
    --ink-2: #4d4f45;
    --ink-3: #83857a;
    --rule: #dbdad3;
    --hair: #e6e5df;
    --accent: #a8601b;
    --accent-soft: rgba(168, 96, 27, 0.10);
    --go: #0b7d31;
    --hold: #8a6400;
    --stop: #b3342f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #111209;
      --panel: #1b1c15;
      --panel-2: #24261c;
      --ink: #f3f3ea;
      --ink-2: #c0c2b2;
      --ink-3: #8b8d80;
      --rule: #32342a;
      --hair: #272920;
      --accent: #d99341;
      --accent-soft: rgba(217, 147, 65, 0.14);
      --go: #35b45c;
      --hold: #d9a93f;
      --stop: #e06a63;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #111209;
    --panel: #1b1c15;
    --panel-2: #24261c;
    --ink: #f3f3ea;
    --ink-2: #c0c2b2;
    --ink-3: #8b8d80;
    --rule: #32342a;
    --hair: #272920;
    --accent: #d99341;
    --accent-soft: rgba(217, 147, 65, 0.14);
    --go: #35b45c;
    --hold: #d9a93f;
    --stop: #e06a63;
    color-scheme: dark;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding-inline: 20px; padding-block: 36px 64px; }

  .mono {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.13em; text-transform: uppercase;
    color: var(--ink-3);
  }
  h1 {
    font-family: Archivo, system-ui, sans-serif; font-weight: 700;
    font-size: clamp(32px, 6vw, 52px); letter-spacing: -0.025em; line-height: 1;
    margin: 10px 0 0; text-wrap: balance;
  }
  .standfirst {
    font-size: 16px; color: var(--ink-2); max-width: 64ch; margin: 14px 0 0;
  }

  .counters {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
    background: var(--rule); border: 1px solid var(--rule);
    margin-top: 28px;
  }
  @media (max-width: 560px) { .counters { grid-template-columns: 1fr; } }
  .counter { background: var(--panel); padding: 14px 16px 16px; }
  .counter .n {
    font-family: Archivo, system-ui, sans-serif; font-weight: 600;
    font-size: 34px; line-height: 1.05; margin-top: 7px;
    font-variant-numeric: tabular-nums;
  }
  .counter .d { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }
  .counter.lead .n { color: var(--accent); }
  .counter .u {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-3); margin-left: 7px;
  }

  section { margin-top: 48px; }
  h2 {
    font-family: Archivo, system-ui, sans-serif; font-weight: 600;
    font-size: 22px; letter-spacing: -0.015em; margin: 0;
    padding-bottom: 10px; border-bottom: 1px solid var(--rule);
  }
  h3 {
    font-family: Archivo, system-ui, sans-serif; font-weight: 600;
    font-size: 16px; margin: 26px 0 8px;
  }
  p { margin: 14px 0; max-width: 72ch; }
  p.tight { margin: 10px 0; }
  .note { font-size: 13.5px; color: var(--ink-2); }

  figure { margin: 22px 0 0; }
  .figscroll { overflow-x: auto; }
  figure svg { display: block; height: auto; }
  figcaption { font-size: 12.5px; color: var(--ink-3); margin-top: 10px; max-width: 72ch; }

  /* Sprint list */
  .sprint { list-style: none; padding: 0; margin: 18px 0 0; }
  .sprint li {
    display: grid; grid-template-columns: 76px 1fr; gap: 16px;
    padding: 11px 0; border-bottom: 1px solid var(--hair); align-items: baseline;
  }
  @media (max-width: 560px) { .sprint li { grid-template-columns: 1fr; gap: 3px; } }
  .sprint .when {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: 0.02em;
  }
  .sprint .what { font-size: 14.5px; }

  /* Gates */
  .gate {
    border: 1px solid var(--rule); background: var(--panel);
    padding: 18px 18px 16px; margin-top: 16px;
  }
  .gate-head {
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline;
    padding-bottom: 12px; border-bottom: 1px solid var(--hair);
  }
  .gate-head .num {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px;
    letter-spacing: 0.13em; text-transform: uppercase; color: var(--ink-3);
  }
  .gate-head .date {
    font-family: Archivo, system-ui, sans-serif; font-weight: 600; font-size: 18px;
  }
  .gate-head .label { font-size: 14px; color: var(--ink-2); }
  .bands { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  @media (max-width: 560px) { .bands { grid-template-columns: 1fr; } }
  .band { padding: 9px 11px; background: var(--panel-2); border-left: 3px solid var(--ink-3); }
  .band.go { border-left-color: var(--go); }
  .band.hold { border-left-color: var(--hold); }
  .band.stop { border-left-color: var(--stop); }
  .band .bl {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10.5px;
    letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600;
  }
  .band.go .bl { color: var(--go); }
  .band.hold .bl { color: var(--hold); }
  .band.stop .bl { color: var(--stop); }
  .band .bv { font-size: 14px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .unlocks { font-size: 13.5px; color: var(--ink-2); margin-top: 13px; }
  .unlocks strong { color: var(--ink); font-weight: 600; }

  /* Partner cards */
  .partners { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--rule);
    border: 1px solid var(--rule); margin-top: 20px; }
  @media (max-width: 860px) { .partners { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .partners { grid-template-columns: 1fr; } }
  .partner { background: var(--panel); padding: 16px; min-width: 0; }
  .partner .who {
    font-family: Archivo, system-ui, sans-serif; font-weight: 600; font-size: 15px;
  }
  .partner .ent { font-size: 11.5px; color: var(--ink-3); margin-top: 2px;
    font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .partner ul { margin: 11px 0 0; padding-left: 16px; }
  .partner li { font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }

  /* Criteria checklist */
  .crit { list-style: none; padding: 0; margin: 16px 0 0; }
  .crit li {
    font-size: 14.5px; padding: 9px 0 9px 26px; border-bottom: 1px solid var(--hair);
    position: relative;
  }
  .crit li::before {
    content: ""; position: absolute; left: 4px; top: 16px;
    width: 9px; height: 9px; border: 1.5px solid var(--accent);
  }

  .tablescroll { overflow-x: auto; margin-top: 16px; }
  table.ftable { border-collapse: collapse; width: 100%; min-width: 480px; font-size: 13.5px; }
  table.ftable th, table.ftable td {
    text-align: left; padding: 9px 14px 9px 0; border-bottom: 1px solid var(--hair);
    vertical-align: top;
  }
  table.ftable th {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10.5px;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3);
    font-weight: 500; border-bottom-color: var(--rule);
  }
  table.ftable td.amt, table.ftable th.amt {
    text-align: right; font-variant-numeric: tabular-nums; padding-right: 0;
    white-space: nowrap;
  }
  table.ftable td.when {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px;
    color: var(--accent); white-space: nowrap;
  }
  table.ftable tr.sum td { border-bottom: none; border-top: 1.5px solid var(--rule); font-weight: 600; padding-top: 11px; }
  table.ftable tr.sum.sub td { border-top: none; padding-top: 3px; font-weight: 600; color: var(--accent); }
  table.ftable tr.paid td { color: var(--ink-3); }
  table.ftable tr.gaterow td {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10.5px;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
    background: var(--accent-soft); padding: 6px 14px 6px 10px;
    border-bottom: 1px solid var(--rule);
  }
  table.ftable td.tbc { color: var(--ink-3); }

  .openitems { border: 1px solid var(--accent); background: var(--accent-soft); padding: 18px; margin-top: 20px; }
  .openitems h3 { margin-top: 0; }
  .openitems ol { margin: 10px 0 0; padding-left: 20px; }
  .openitems li { font-size: 14px; margin-bottom: 7px; }

  footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--rule); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  /* Silo descent: ambient scroll-linked overlay, sits ABOVE content so it is always visible
     regardless of what the decrypted plan content renders underneath. Pointer-events are
     disabled throughout so it never blocks reading, selecting or clicking. */
  #silo {
    position: fixed; inset: 0; z-index: 2147483000; overflow: hidden; pointer-events: none;
    opacity: 0; transition: opacity 1.1s ease;
  }
  html:not(.locked) #silo { opacity: 1; }
  #silo .rails {
    position: absolute; inset: -30% -30%;
    background:
      repeating-radial-gradient(circle at 50% 40%, rgba(217,147,65,.32) 0 1.5px, transparent 1.5px 64px),
      repeating-radial-gradient(circle at 50% 40%, rgba(217,147,65,.16) 0 1px, transparent 1px 22px);
    mix-blend-mode: overlay;
    transform: translateY(0) scale(1.1);
    will-change: transform;
  }
  #silo .edges {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(13,14,9,.5) 0, transparent 7% 93%, rgba(13,14,9,.5) 100%);
  }
  #silo .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 32%, transparent 24%, rgba(5,4,2,.78) 100%);
    opacity: .55; will-change: opacity;
  }
  #depth-readout {
    position: fixed; right: 18px; bottom: 18px; z-index: 2147483001;
    display: flex; align-items: baseline; gap: 8px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: #ffcf87; background: rgba(13,14,9,.82);
    border: 1px solid rgba(217,147,65,.45); padding: 8px 13px; border-radius: 2px;
    box-shadow: 0 2px 14px rgba(0,0,0,.35);
    pointer-events: none;
    opacity: 0; transition: opacity 1.1s ease;
  }
  html:not(.locked) #depth-readout { opacity: 1; }
  #depth-readout .dr-label { color: #c7c6b8; }
  #depth-readout #depth-val { font-weight: 600; font-variant-numeric: tabular-nums; color: #ffcf87; }
  #depth-readout .dr-unit { color: #c7c6b8; }
  @media (max-width: 560px) { #depth-readout { font-size: 10.5px; right: 10px; bottom: 10px; padding: 6px 10px; } }
  @media (prefers-reduced-motion: reduce) { #silo .rails, #silo .vignette { transition: none !important; } }

  /* Masthead: official ATOMIKA wordmark, inherits ink colour in both themes */
  h1.masthead { margin: 0 0 14px; line-height: 1; }
  .atomika-mark { display: block; width: min(100%, 560px); height: auto; color: var(--ink); }
  .masthead-sub {
    display: block; margin-top: 14px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 13px; letter-spacing: .20em; text-transform: uppercase;
    font-weight: 500; color: var(--accent);
  }
  @media (max-width: 520px) { .masthead-sub { font-size: 11px; letter-spacing: .16em; } }
</style>

<style id="gate-style">
  html.locked, html.locked body { height: 100%; overflow: hidden; }
  #gate {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: #0d0e09;
    color: #e8e7df;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    transition: opacity .55s ease;
  }
  #gate.lifting { opacity: 0; pointer-events: none; }
  #gate .rings { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; pointer-events: none; }
  #gate .rings svg { width: min(130vmin, 1100px); height: auto; opacity: .16; color: #a8601b; }
  #gate .rings .spin { transform-origin: 300px 300px; animation: gspin 90s linear infinite; }
  @keyframes gspin { to { transform: rotate(360deg); } }
  #gate .card { position: relative; width: 100%; max-width: 452px; text-align: center; }
  #gate .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase;
    color: #8f9183; margin-bottom: 26px;
  }
  #gate .eyebrow b { color: #c47b2c; font-weight: 500; }
  #gate .mark { margin: 0 0 14px; line-height: 1; }
  #gate .mark svg { display: block; width: 100%; height: auto; color: #f3f2ea; }
  #gate .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  #gate .sub {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: .20em; text-transform: uppercase;
    color: #a8601b; margin-bottom: 30px;
  }
  #gate .rule { height: 1px; background: #2a2b22; margin: 0 0 26px; }
  #gate .blurb { font-size: 13.5px; line-height: 1.7; color: #9b9d8e; margin: 0 0 26px; text-wrap: balance; }
  #gate form { display: flex; flex-direction: column; gap: 10px; }
  #gate label {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
    color: #75776a; text-align: left;
  }
  #gate input {
    width: 100%; box-sizing: border-box;
    background: #14150e; border: 1px solid #33352a; border-radius: 3px;

  var ITER = 250000;

  var html = document.documentElement;
  html.classList.add("locked");

  var gate = document.getElementById("gate");
  var form = document.getElementById("gate-form");
  var pw   = document.getElementById("gate-pw");
  var go   = document.getElementById("gate-go");
  var msg  = document.getElementById("gate-msg");
  var vault= document.getElementById("vault");

  function b64(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function startCountdown() {
    var targets = [
      ["c-launch", "u-launch", Date.UTC(2026, 9, 21)],
      ["c-gate",   "u-gate",   Date.UTC(2027, 1, 5)],
      ["c-event",  "u-event",  Date.UTC(2027, 4, 7)]
    ];
    function tick() {
      var now = new Date();
      var today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
      for (var i = 0; i < targets.length; i++) {
        var el = document.getElementById(targets[i][0]);
        var unit = document.getElementById(targets[i][1]);
        if (!el) continue;
        var days = Math.round((targets[i][2] - today) / 86400000);
        el.textContent = days > 0 ? String(days) : (days === 0 ? "Today" : "Passed");
        if (unit) unit.hidden = days <= 0;
      }
    }
    tick();
    setInterval(tick, 60000);
  }

  function fail(text) {
    msg.textContent = text || "Access key not recognised";
    gate.classList.add("bad");
    go.disabled = false;
    go.textContent = "Unlock";
    pw.select();
    setTimeout(function () { gate.classList.remove("bad"); }, 400);
  }

  function unlock(plaintext) {
    go.disabled = true;
    go.textContent = "Unlock";
    msg.textContent = "";
    gate.classList.add("detonating");
    var audio = document.getElementById("silo-audio");
    if (audio) {
      audio.currentTime = 0;
      audio.volume = 0.85;
      audio.play().catch(function () {});
    }
    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var delay = reduced ? 0 : 900;
    setTimeout(function () {
      vault.innerHTML = plaintext;
      vault.hidden = false;
      startCountdown();
      gate.classList.add("lifting");
      html.classList.remove("locked");
      setTimeout(function () { if (gate && gate.parentNode) gate.parentNode.removeChild(gate); }, 600);
    }, delay);
  }

  function attempt(e) {
    if (e) e.preventDefault();
    var pass = pw.value;
    if (!pass) { fail("Enter the access key"); return; }
    if (!window.crypto || !window.crypto.subtle) {
      fail("Needs a secure connection (https)");
      return;
    }
    go.disabled = true;
    go.textContent = "Checking";
    msg.textContent = "";

    var raw = b64(PAYLOAD);
    var salt = raw.slice(0, 16), iv = raw.slice(16, 28), data = raw.slice(28);
    var enc = new TextEncoder();

    crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data);
      })
      .then(function (buf) {
        unlock(new TextDecoder().decode(buf));
      })
      .catch(function () { fail(); });
  }

  go.addEventListener("click", attempt);
  pw.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.keyCode === 13) attempt(e);
  });

  pw.focus();
})();
</script>

<script>
(function () {
  var rails = document.querySelector("#silo .rails");
  var vignette = document.querySelector("#silo .vignette");
  var depthVal = document.getElementById("depth-val");
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var ticking = false;

  function update() {
    ticking = false;
    var doc = document.documentElement;
    var max = (doc.scrollHeight || doc.offsetHeight) - window.innerHeight;
    var y = window.scrollY || window.pageYOffset || 0;
    var pct = max > 0 ? Math.min(1, Math.max(0, y / max)) : 0;

    if (rails) {
      var shift = reduced ? 0 : -(pct * 320);
      var scale = 1.1 + pct * 0.45;
      rails.style.transform = "translateY(" + shift.toFixed(1) + "px) scale(" + scale.toFixed(3) + ")";
    }
    if (vignette) {
      vignette.style.opacity = (0.5 + pct * 0.42).toFixed(3);
    }
    if (depthVal) {
      var ft = Math.round(pct * 180);
      depthVal.textContent = String(ft).padStart(4, "0");
    }
  }

  function onScroll() {
    if (!ticking) {
      window.requestAnimationFrame(update);
      ticking = true;
    }
  }

  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll);
  update();
})();
</script>
